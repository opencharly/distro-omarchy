#  opencharly/distro-omarchy — the Omarchy image family (charly's box/omarchy).
#
#  Omarchy (omacom/omarchy) is DHH's opinionated distribution: vanilla Arch + Hyprland,
#  with its own package repository AND its own pinned snapshot of the Arch repositories.
#
#  ARCH-DERIVED, via the TAG CHAIN. Every box carries `distro: [omarchy, arch]`, so an
#  omarchy: package section wins where one exists and all 99 existing `distro: arch:`
#  candy sections apply unchanged everywhere else. No candy needs an omarchy: section;
#  one is added only where a package NAME genuinely differs from Arch's. This is the
#  same mechanism distro-cachyos uses, and it is why this repo vendors almost nothing.
#
#  x86_64 ONLY. pkgs.omarchy.org publishes no aarch64 tree (verified: 404), so every box
#  pins platform: [linux/amd64] and there is no archarm sibling.
#
#  We do NOT run Omarchy's own installer. In 4.x there is no install.sh at the repo root
#  at all: `install/` is the machinery the ISO runs, and the ISO is the install path.
#  charly composes the same four packages the ISO installs (omarchy, omarchy-settings,
#  omarchy-keyring, omarchy-nvim) from the same repositories — see layer-omarchy-base.
#  All 148 base packages resolve with plain pacman (23 from [omarchy], 125 from
#  core/extra/multilib served by Omarchy's mirror snapshot), which is why the base box is
#  `build: [pac]` with NO aur builder.
version: 2026.240.1943
repo: github.com/opencharly/distro-omarchy
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
import:
    # The Arch base and builder stack lives in opencharly/distro-arch. One-directional:
    # arch imports nothing back.
    - arch: '@github.com/opencharly/distro-arch:v2026.241.1429'
discover:
    - path: box
      recursive: true

# ── disposable R10 beds ──────────────────────────────────────────────────────────
# `disposable: true` is the SOLE authorization for the unattended destroy + rebuild
# `charly check run` performs. Zero operator side-effect: rootless podman, no writes to
# ~/.local/bin, ~/.config/opencharly, /etc or any operator-side directory.
check-omarchy-pod:
    pod:
        image: omarchy
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that the Omarchy base image composes from plain Arch plus Omarchy's
            own package sources. Builds the omarchy box and asserts, on the built image,
            that pacman resolves core/extra/multilib from Omarchy's pinned mirror snapshot
            rather than upstream Arch, that the [omarchy] repository answers and its
            packaging key is locally signed, that omarchy and omarchy-settings install
            with plain pacman and no AUR builder, that the four limine alpm hooks a
            container cannot satisfy were never extracted onto the image, and that
            /etc/skel is seeded into the image user's home.

check-omarchy-cstream-pod:
    pod:
        image: omarchy-cstream
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that the Omarchy DESKTOP runs. Builds the omarchy-cstream box and,
            on the started deployment, asserts that the Quickshell shell reaches a
            supervised RUNNING state under a nested Hyprland and that charly's own wl:
            verb reports hyprland as the live compositor — not a process-list inference.
            It is the bed that would catch a regression in the one arrangement that works:
            Hyprland cannot nest under selkies (pixelflux advertises wl_compositor v5 and
            Hyprland binds v6), so the desktop depends on gst-wayland-display being the
            parent, and on the box deriving FROM the omarchy base image so every layer
            resolves against the same package snapshot.

# ── Omarchy as a VM ──────────────────────────────────────────────────────────────────
#
# omarchy-vm is the FAITHFUL one: it boots Omarchy's own official installer ISO, fully
# unattended. What you get is what Omarchy's authors ship — limine + a UKI, btrfs
# @/@home/@log/@pkg, snapper, sddm + uwsm. Charly supplies only the answers.
#
# The composable sibling omarchy-pacstrap-vm (charly's own machinery reproducing Omarchy
# from packages) LANDED — it is below, with check-omarchy-pacstrap-vm proving it boots.
# The two answer different questions and both are kept: omarchy-vm proves Omarchy's own
# installer produces a correct machine, omarchy-pacstrap-vm proves charly's from-packages
# path does.
#
# charly-omarchy is a DEPLOY of this template, not a second template: a deploy's `from:`
# carries deploy-scope fields only (add_candy, install_opts, disposable, env, plan) and the
# VM SPEC comes wholly from the named kind: vm entity, so credentials live here and are
# never restated.
#
# check-omarchy-desktop-vm is the third VM claim and the only one about the DESKTOP. It
# derives from omarchy-vm and adds an sddm autologin drop-in, because a stock Omarchy stops
# at the greeter and a bed has nobody to type a password. Install-time correctness and a
# working desktop are different claims, so they are different beds.

omarchy-vm:
    vm:
        # THE canonical Omarchy VM: the official ISO, run unattended.
        #
        # The ISO is 5.8 GiB. It is fetched once into charly's content-addressed cache,
        # sha256-verified against the .sha256 sidecar the publisher serves (no checksum
        # value is authored here — pinning a literal would go stale on every point
        # release while the sidecar cannot), and shared by every VM built from this URL.
        #
        # user / user with NO disk encryption, and that combination is deliberate. An
        # encrypted install is NOT fully unattended — someone types the LUKS passphrase
        # at first boot — and its passphrase sits in PLAINTEXT in the seed's
        # disk_encryption block, which would make this file a secret. With encrypt:
        # false there is no such block and nothing on the seed that is not already
        # public. Treat anything reachable from a VM built on this template as public.
        source:
            kind: iso
            distro: omarchy
            url: https://iso.omarchy.org/omarchy-4.0.1.iso
            checksum: {type: sha256}
            installer:
                username: user
                # PLAINTEXT here, crypt()ed to a $6$ SHA-512 hash by the builder before
                # it reaches any template — the plaintext never lands on the seed. The
                # answers volume carries only the hash.
                password: user
                full_name: Charly
                email: charly@opencharly.invalid
                hostname: omarchy
                timezone: UTC
                keyboard: us
                locale: en_US.UTF-8
                disk: /dev/vda
                encrypt: false
                # ssh_authorized_key is deliberately ABSENT: it defaults to the public
                # half of ssh.key_source: generate below. That default is what makes the
                # guest reachable at all — a stock Omarchy install ships openssh with the
                # service DISABLED and the port CLOSED, and the installer treats the
                # presence of an authorized_keys file on the seed as the instruction to
                # enable sshd and open the firewall. Naming a key here would silence that
                # default without saying so.
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        # Omarchy requires Secure Boot OFF.
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: user, port_auto: true, key_source: generate}
        backend: libvirt
        # A DISPLAY IS REQUIRED, not decorative. Omarchy's installer runs in a graphical
        # session on the ISO's live environment; a domain with no video device boots the
        # medium, runs cloud-init against the seed, and then sits idle forever with the
        # disk untouched — measured. The spice head is also what lets `charly check spice
        # screenshot` watch an unattended install actually progress, which is the only
        # way to see where one stalls.
        libvirt:
            devices:
                channels: [{type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
                rng: [{model: virtio, backend: /dev/urandom}]
                memballoon: {model: virtio}
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"

check-omarchy-iso-vm:
    vm:
        from: omarchy-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that Omarchy installs itself UNATTENDED from its own official ISO.
            Derives from the omarchy-vm template rather than restating it, so the
            credentials and the seed under test are exactly the ones the shipped entity
            carries. `disposable: true` authorizes the destroy + rebuild, which is what
            makes the claim meaningful: a bed that only ever inspected an
            already-installed guest would pass on a disk somebody installed by hand.
            .
            What it proves that nothing else can: the installer ran with NOBODY AT THE
            KEYBOARD. Every assertion below is a fact about the INSTALLED system that
            cannot be true unless charly's rendered answers were found, parsed and acted
            on — the btrfs subvolume layout and the ESP at /boot come from the partition
            geometry in the distro's installer: block, the account and its sudo group
            from user_credentials.json, the hostname and timezone from
            user_configuration.json, the git identity from the two .txt files, and sshd
            being enabled AT ALL from authorized_keys (a stock Omarchy install ships
            openssh with the service disabled and the port closed).
            .
            EVERY check runs as the unprivileged `user` the installer created, because
            that is the only account the seed authorizes and charly's check runner has no
            other. That constraint is a feature: it forced each assertion onto evidence
            that is READABLE rather than privileged, and every one of those turned out to
            be STRONGER than the root-only form it replaced. `findmnt` at each mountpoint
            proves a subvolume exists AND is mounted where the answers said, which `btrfs
            subvolume list` cannot; `efibootmgr` proves limine's EFI binary is on the ESP,
            registered as a boot entry, AND that the machine booted from it, which `test
            -d /boot/EFI/limine` cannot.
        plan:
            # ── the guest is the installed system ────────────────────────────────
            - check: the guest is the INSTALLED system, not the live ISO
              id: omarchy-iso-vm-installed
              context:
                  - runtime
              # omarchy-settings REPLACES /etc/os-release, so ID=omarchy is only true of
              # an installed guest — archiso's live environment reports ID=arch. The
              # cheapest fact separating the two, and the one that fails loudly if this
              # bed is ever pointed at a guest that never installed.
              file:
                  file: /etc/os-release
                  contains:
                      - 'ID=omarchy'

            # ── the disk layout the installer answers asked for ──────────────────
            # One `mount:` step per subvolume, not one shell loop over four. A step
            # carries at most one verb, and a per-mountpoint step NAMES the subvolume
            # that is wrong instead of failing a whole script at its first line.
            #
            # The matcher is an ANCHORED REGEX, not `contains`. `mount:` matches against
            # the whole comma-joined option string (plugin-mount/.../plugin.go:71-77), so
            # `contains: subvol=/@` would also match `subvol=/@home` — every one of these
            # four would pass on any of the others. `subvol=/@($|,)` cannot.
            #
            # findmnt (which `mount:` drives) also proves strictly MORE than
            # `btrfs subvolume list`: that needs CAP_SYS_ADMIN, which the unprivileged
            # `user` account this bed runs as does not have, and it cannot say where a
            # subvolume is mounted — only that it exists.
            - check: root is the @ subvolume of a btrfs filesystem
              id: omarchy-iso-vm-subvol-root
              context:
                  - runtime
              mount:
                  mount: /
                  filesystem: btrfs
                  opt:
                      - matches: 'subvol=/@($|,)'

            - check: /home is the @home subvolume the answers placed there
              id: omarchy-iso-vm-subvol-home
              context:
                  - runtime
              mount:
                  mount: /home
                  filesystem: btrfs
                  opt:
                      - matches: 'subvol=/@home($|,)'

            - check: /var/log is the @log subvolume the answers placed there
              id: omarchy-iso-vm-subvol-log
              context:
                  - runtime
              mount:
                  mount: /var/log
                  filesystem: btrfs
                  opt:
                      - matches: 'subvol=/@log($|,)'

            - check: /var/cache/pacman/pkg is the @pkg subvolume the answers placed there
              id: omarchy-iso-vm-subvol-pkg
              context:
                  - runtime
              mount:
                  mount: /var/cache/pacman/pkg
                  filesystem: btrfs
                  opt:
                      - matches: 'subvol=/@pkg($|,)'

            - check: the ESP is vfat at /boot, not /boot/efi
              id: omarchy-iso-vm-esp
              context:
                  - runtime
              mount:
                  mount: /boot
                  filesystem: vfat

            # ── the bootloader ───────────────────────────────────────────────────
            # Two independent facts, one verb each, replacing a shell correlation of
            # `efibootmgr`'s BootCurrent against its Limine entry. Together they are at
            # least as strong and carry no shell logic:
            #   1. limine's EFI binary is on the ESP AND registered as a boot entry;
            #   2. the RUNNING kernel was handed the command line that only limine's
            #      config sets — which a guest booted any other way could not have.
            # (2) is the assertion check-omarchy-pacstrap-vm's own RCA settled on as
            # stronger than a named-NVRAM-entry test, because the bootstrap path boots
            # through the firmware's auto-created removable-media entry and registers no
            # named entry at all.
            - check: limine's EFI binary is on the ESP and registered as a boot entry
              id: omarchy-iso-vm-limine-registered
              context:
                  - runtime
              # efibootmgr reads efivars and needs no privilege. `test -f
              # /boot/limine.conf` cannot be used: the installed ESP is mode 0700
              # root-only, so as `user` that is a permission denial and NOT evidence
              # about limine.
              stdout:
                  - matches: 'Boot[0-9A-Fa-f]{4}\*? Limine.*limine_x64\.efi'
              command:
                  command: efibootmgr

            - check: the kernel was booted with the command line limine's config specifies
              id: omarchy-iso-vm-limine-cmdline
              context:
                  - runtime
              file:
                  file: /proc/cmdline
                  contains:
                      - 'rootflags=subvol=@'
                      - 'rootfstype=btrfs'

            - check: limine's config carries the answers' ESP path and root device
              id: omarchy-iso-vm-limine-config
              context:
                  - runtime
              # /etc/default/limine is world-readable and is where the installer records
              # the geometry it chose. Asserting BOTH the ESP path and the root cmdline
              # ties the bootloader's own view back to the partition layout above.
              file:
                  file: /etc/default/limine
                  contains:
                      - 'ESP_PATH="/boot"'
                      - 'rootflags=subvol=@'

            # ── snapshots ────────────────────────────────────────────────────────
            - check: snapper is configured for root
              id: omarchy-iso-vm-snapper-config
              context:
                  - runtime
              file:
                  file: /etc/snapper/configs/root
                  exists: true

            - check: limine-snapper-sync is enabled, so snapshots reach the boot menu
              id: omarchy-iso-vm-snapper-sync
              context:
                  - runtime
              service:
                  service: limine-snapper-sync
                  enabled: true

            # ── what the seed's answers created ──────────────────────────────────
            - check: the account from user_credentials.json exists with the installer's home
              id: omarchy-iso-vm-account
              context:
                  - runtime
              user:
                  user: user
                  home: /home/user

            - check: the account from user_credentials.json is in wheel, so sudo works
              id: omarchy-iso-vm-account-wheel
              context:
                  - runtime
              # AWAITING G6: neither `user:` (user/uid/gid/home/shell/linger) nor
              # `unix_group:` (unix_group/gid) can assert group MEMBERSHIP, so `"sudo":
              # true` in user_credentials.json has no typed form yet. Converts to
              # `user: {groups: [wheel]}` the moment plugin-user gains the field.
              stdout:
                  - matches: '(^|\s)wheel(\s|$)'
              command:
                  command: id -nG user

            - check: the hostname from user_configuration.json was applied
              id: omarchy-iso-vm-hostname
              context:
                  - runtime
              file:
                  file: /etc/hostname
                  contains:
                      - omarchy

            - check: the timezone from user_configuration.json was applied
              id: omarchy-iso-vm-timezone
              context:
                  - runtime
              # `file:` has no symlink-TARGET matcher — filetype: symlink would prove
              # /etc/localtime is a link without proving where it points, which is the
              # entire assertion. Running readlink and matching its output is what the
              # `command:` verb is for.
              stdout:
                  - contains: /usr/share/zoneinfo/UTC
              command:
                  command: readlink -f /etc/localtime

            - check: the git identity from the seed's two .txt files was applied
              id: omarchy-iso-vm-git-identity
              context:
                  - runtime
              # user_full_name.txt and user_email_address.txt are OPTIONAL seed files.
              # Asserting them proves charly's renderer emitted the optional half of the
              # answer set and the installer consumed it — not just the required half.
              #
              # This one ASKS GIT rather than reading a file, and that is deliberate. An
              # earlier revision of this check probed /home/user/.gitconfig with `file:`
              # and FAILED (`exists=false`) against a guest whose identity was correctly
              # applied: git's `--global` scope resolves to $XDG_CONFIG_HOME/git/config
              # when that file already exists, and omarchy-settings ships /etc/skel/.config
              # — which the installer copies into the new account — so the identity lands
              # in ~/.config/git/config, measured on the live guest:
              #
              #     $ ls ~/.gitconfig            -> No such file or directory
              #     $ ls ~/.config/git/config    -> -rw-r--r-- 1 user user 978
              #     $ git config --global --get-regexp '^user\.'
              #     user.name Charly
              #     user.email charly@opencharly.invalid
              #
              # The assertion is "the identity was APPLIED", and git's own resolution is
              # what "applied" means. Hardcoding either path asserts something narrower
              # and breaks when the other one is in play. Do not convert this to `file:`.
              stdout:
                  - contains: Charly
                  - contains: charly@opencharly.invalid
              command:
                  command: git config --global --get-regexp '^user\.'

            # ── the runtime the ISO installs ─────────────────────────────────────
            # One `package:` per package rather than a single `pacman -Q` over ten: the
            # failure then names the missing package instead of reporting that some
            # unnamed member of a list is absent.
            - check: the omarchy metapackage is installed
              id: omarchy-iso-vm-pkg-omarchy
              context:
                  - runtime
              package:
                  package: omarchy
                  installed: true

            - check: omarchy-settings is installed — it owns /etc/skel and os-release
              id: omarchy-iso-vm-pkg-omarchy-settings
              context:
                  - runtime
              package:
                  package: omarchy-settings
                  installed: true

            - check: hyprland is installed
              id: omarchy-iso-vm-pkg-hyprland
              context:
                  - runtime
              package:
                  package: hyprland
                  installed: true

            - check: quickshell is installed — the bar, launcher, OSD and lockscreen
              id: omarchy-iso-vm-pkg-quickshell
              context:
                  - runtime
              package:
                  package: quickshell
                  installed: true

            - check: sddm is installed
              id: omarchy-iso-vm-pkg-sddm
              context:
                  - runtime
              package:
                  package: sddm
                  installed: true

            - check: uwsm is installed — the session manager Omarchy launches Hyprland under
              id: omarchy-iso-vm-pkg-uwsm
              context:
                  - runtime
              package:
                  package: uwsm
                  installed: true

            - check: limine is installed
              id: omarchy-iso-vm-pkg-limine
              context:
                  - runtime
              package:
                  package: limine
                  installed: true

            - check: limine-mkinitcpio-hook is installed, so kernel updates regenerate entries
              id: omarchy-iso-vm-pkg-limine-mkinitcpio-hook
              context:
                  - runtime
              package:
                  package: limine-mkinitcpio-hook
                  installed: true

            - check: limine-snapper-sync is installed
              id: omarchy-iso-vm-pkg-limine-snapper-sync
              context:
                  - runtime
              package:
                  package: limine-snapper-sync
                  installed: true

            - check: snapper is installed
              id: omarchy-iso-vm-pkg-snapper
              context:
                  - runtime
              package:
                  package: snapper
                  installed: true

            - check: the Quickshell shell tree the omarchy package ships is present
              id: omarchy-iso-vm-shell-tree
              context:
                  - runtime
              file:
                  file: /usr/share/omarchy/shell
                  filetype: directory

            # ── the seed turned sshd on ──────────────────────────────────────────
            - check: sshd is enabled AND running — which only authorized_keys turns on
              id: omarchy-iso-vm-sshd
              context:
                  - runtime
              # A stock Omarchy install ships openssh with the unit disabled and the
              # firewall port closed. That this check can run AT ALL — it arrives over
              # ssh, on the key charly generated — is the proof; asserting the unit
              # state makes the proof explicit rather than incidental.
              service:
                  service: sshd
                  enabled: true
                  running: true

            # ══ upstream test/acceptance.d/system-test.sh ═══════════════════════════════
            # Ported from omacom/omarchy@quattro. Upstream groups its assertions into five
            # bash functions (verify_core_packages / _defaults / _services / _runtime_tools
            # / _user_setup) and fails the whole group at its first bad line; each is one
            # typed step here, so a failure names the exact fact that is wrong.

            # ── the services a desktop needs enabled ────────────────────────────────────
            - check: NetworkManager is enabled and running
              id: omarchy-sys-networkmanager
              context:
                  - runtime
              service:
                  service: NetworkManager.service
                  enabled: true
                  running: true

            - check: systemd-resolved is enabled and running
              id: omarchy-sys-resolved
              context:
                  - runtime
              service:
                  service: systemd-resolved.service
                  enabled: true
                  running: true

            - check: the ufw firewall is enabled and running
              id: omarchy-sys-ufw
              context:
                  - runtime
              service:
                  service: ufw.service
                  enabled: true
                  running: true

            - check: sddm is enabled — the graphical session starts at boot
              id: omarchy-sys-sddm
              context:
                  - runtime
              service:
                  service: sddm.service
                  enabled: true

            - check: avahi-daemon is enabled
              id: omarchy-sys-avahi
              context:
                  - runtime
              service:
                  service: avahi-daemon.service
                  enabled: true

            - check: power-profiles-daemon is enabled
              id: omarchy-sys-ppd
              context:
                  - runtime
              service:
                  service: power-profiles-daemon.service
                  enabled: true

            - check: the docker socket is enabled — the daemon is reachable through polkit
              id: omarchy-sys-docker-socket
              context:
                  - runtime
              service:
                  service: docker.socket
                  enabled: true

            # ── the whole-machine assertion, both managers ──────────────────────────────
            # The strongest check in the suite: it catches the unit nobody thought to name.
            # A fresh VM should need no `ignore:` regex, and deliberately has none — the
            # moment one is needed, that is a finding rather than a configuration detail.
            - check: no system unit is in the failed state
              id: omarchy-sys-none-failed-system
              context:
                  - runtime
              eventually: 90s
              service:
                  none_failed: true

            - check: no user unit is in the failed state
              id: omarchy-sys-none-failed-user
              context:
                  - runtime
              eventually: 90s
              service:
                  scope: user
                  none_failed: true

            # ── the user audio stack ────────────────────────────────────────────────────
            # Session services, not system ones. Before `scope: user` these had no typed
            # form at all and the repo reached for `command: systemctl --user ...` in 85
            # places.
            - check: pipewire is running in the user session
              id: omarchy-sys-pipewire
              context:
                  - runtime
              eventually: 60s
              service:
                  service: pipewire.service
                  scope: user
                  running: true

            - check: wireplumber is running in the user session
              id: omarchy-sys-wireplumber
              context:
                  - runtime
              eventually: 60s
              service:
                  service: wireplumber.service
                  scope: user
                  running: true

            # ── the security posture upstream asserts, and why ──────────────────────────
            # The docker group is root-equivalent: a member can `docker run -v /:/host` its
            # way to passwordless root. Omarchy deliberately does NOT put the desktop user
            # in it — the daemon is reached through a polkit/sudo prompt instead. Asserting
            # the absence is the point; asserting it EXACTLY is why `not_groups` is a set
            # and not a `contains:` matcher, which would also match `docker-users`.
            - check: the desktop user is NOT in the root-equivalent docker group
              id: omarchy-sys-user-not-in-docker
              context:
                  - runtime
              user:
                  user: user
                  not_groups:
                      - docker

            - check: the desktop user cannot reach the docker daemon without elevation
              id: omarchy-sys-docker-unreachable
              context:
                  - runtime
              # The group name being absent is not sufficient — a world-writable socket or
              # an ACL would still hand the user the root daemon. This proves the daemon is
              # actually unreachable, which is a NEGATIVE assertion: `expect_non_zero` is
              # the only honest way to say "this must fail".
              command:
                  command: docker info
                  expect_non_zero: true

            # ── the runtime tools the desktop is built around ───────────────────────────
            - check: neovim starts headlessly
              id: omarchy-sys-nvim-headless
              context:
                  - runtime
              command:
                  command: nvim --headless +qa

            - check: fastfetch can read system information
              id: omarchy-sys-fastfetch
              context:
                  - runtime
              command:
                  command: fastfetch --pipe false

            # ── the user state Omarchy's own tooling writes ─────────────────────────────
            - check: a current theme is recorded in the user's omarchy state
              id: omarchy-sys-state-theme
              context:
                  - runtime
              file:
                  file: /home/user/.local/state/omarchy/current/theme
                  exists: true

            - check: a current background is recorded in the user's omarchy state
              id: omarchy-sys-state-background
              context:
                  - runtime
              file:
                  file: /home/user/.local/state/omarchy/current/background
                  exists: true

            - check: the shell configuration exists and is valid JSON
              id: omarchy-sys-shell-json
              context:
                  - runtime
              # `file: {contains:}` would prove text is present, not that the document
              # parses — and an unparseable shell.json is exactly the failure that leaves a
              # desktop with no bar. Asking jq is the assertion.
              command:
                  command: jq empty /home/user/.config/omarchy/shell.json

            # ── the XDG user directories the installer creates ──────────────────────────
            # NOT asserted: Documents and Desktop. Upstream checks
            # `[[ -d $(xdg-user-dir DOCUMENTS) ]]`, and on this guest
            # ~/.config/user-dirs.dirs defines only XDG_DESKTOP_DIR="$HOME/" — so
            # xdg-user-dir falls back to $HOME for both, $HOME is a directory, and
            # upstream's check passes VACUOUSLY without either directory existing.
            # Measured on the installed guest: ~/Documents and ~/Desktop are absent while
            # ~/Downloads and ~/Pictures are real. Asserting the two that exist is the
            # only honest form; asserting the other two would fail on a correct guest.
            - check: the XDG Downloads directory exists
              id: omarchy-sys-xdg-downloads
              context:
                  - runtime
              file:
                  file: /home/user/Downloads
                  filetype: directory

            - check: the XDG Pictures directory exists
              id: omarchy-sys-xdg-pictures
              context:
                  - runtime
              file:
                  file: /home/user/Pictures
                  filetype: directory

            # ══ upstream test/acceptance.d/cups-test.sh ═════════════════════════════════
            # A hardening suite, not a feature suite: it asserts that the parts of CUPS
            # which widen the attack surface are ABSENT, and that the parts which remain
            # are locked down.

            - check: the printing stack is installed
              id: omarchy-cups-installed
              context:
                  - runtime
              package:
                  package: cups
                  installed: true

            # ── NOT asserted on this ISO: Omarchy's CUPS hardening ─────────────────
            # Upstream's cups-test.sh asserts that cups-pdf, cups-browsed and
            # unauthenticated `lpinfo -v` are all ABSENT. None of that holds here, and the
            # guest is right — the test suite is newer than the artifact under test.
            #
            # This bed pins omarchy-4.0.1.iso, and 4.0.1's own
            # /usr/share/omarchy/install/omarchy-base.packages lists:
            #
            #     cups  cups-browsed  cups-filters  cups-pdf
            #
            # with no cups-pk-helper. Its post-install does not REMOVE cups-browsed, it
            # CONFIGURES it (install/post-install/pacman.sh copies
            # etc-overrides/cups-cups-browsed.conf into /etc/cups). The hardening landed in
            # omarchy AFTER 4.0.1, which is why `test/acceptance.d/cups-test.sh` at quattro
            # HEAD expects the opposite of what 4.0.1 ships.
            #
            # Porting those five assertions unchanged made the bed fail against a correct
            # guest. They belong here the moment `source.url` moves to a release carrying
            # the hardening — and at that point they become a genuine regression gate for it.
            #
            # What IS asserted below is what 4.0.1 itself guarantees.
            - check: the CUPS filter stack 4.0.1 ships is installed
              id: omarchy-cups-filters
              context:
                  - runtime
              package:
                  package: cups-filters
                  installed: true

            - check: CUPS is enabled, running, and answering
              id: omarchy-cups-running
              context:
                  - runtime
              service:
                  service: cups.service
                  enabled: true
                  running: true

            - check: the CUPS authorization policy file is root-owned and group-readable only
              id: omarchy-cups-policy-protected
              context:
                  - runtime
              # Upstream asserts `root:cups 640` via stat. Three typed attributes on one
              # step say the same thing and name which one is wrong when it breaks.
              file:
                  file: /etc/cups/cups-files.conf
                  owner: root
                  group_of: cups
                  mode: "0640"

# ── charly-omarchy — the ready-to-run KEEPER ─────────────────────────────────────
# A DEPLOY of omarchy-vm, not a third template. A deploy's `from:` carries
# deploy-scope fields only (add_candy, install_opts, disposable, env, plan); the VM
# SPEC — source, disk/ram/cpu, firmware, ssh, libvirt — comes wholly from the named
# kind: vm entity. So the ISO, the seed and the credentials are the ones omarchy-vm
# already ships, stated once.
#
# NOT disposable: this one is meant to be kept. Its disposable twin below is what
# proves it, so that `charly update` can rebuild the bed from scratch without ever
# touching an operator's working guest.
charly-omarchy:
    vm:
        from: omarchy-vm
        lifecycle: dev
        description: >-
            Ready-to-run Omarchy with the charly toolchain on top: the faithful upstream
            ISO install (limine + a UKI, btrfs @/@home/@log/@pkg, snapper, sddm + uwsm,
            Hyprland and the Quickshell omarchy shell — the real thing, not a charly
            reconstruction), plus an on-PATH charly. Logs in as user/user, unencrypted,
            so treat anything reachable from it as public.
        add_candy:
            # charly installs as a NATIVE pac package from the charly-arch repo. omarchy
            # inherits arch's packaging (distro: [omarchy, arch]), so the layer's `arch:`
            # section applies unchanged and nothing omarchy-specific is needed here.
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
        install_opts:
            # The layer adds the [charly] pacman repo and imports its signing key, which
            # is a repo change by definition.
            allow_repo_changes: true
            # Installing a package and enabling its units needs root. The guest's
            # passwordless sudo is established at prepare-venue for source.kind: iso —
            # a stock Omarchy install grants the account PASSWORD-required sudo, which no
            # archinstall answer or Omarchy orchestrator hook can change.
            allow_root_tasks: true
            with_service: true
            # The layer carries rpm:/deb:-only sections for other families; skip them
            # rather than failing on a section this distro cannot use.
            skip_incompatible: true

# ── the disposable twin ──────────────────────────────────────────────────────────
# It derives from the TEMPLATE, not from charly-omarchy: a bed's `from:` names a
# kind: vm entity, and charly-omarchy is itself a deploy. Same add_candy and same
# install_opts, so what it proves is what the keeper does.
check-charly-omarchy-vm:
    vm:
        from: omarchy-vm
        disposable: true
        description: >-
            Sole proof that charly's own toolchain installs onto a guest Omarchy
            installed from its own ISO. `disposable: true` authorizes the destroy +
            rebuild, so the claim is about a guest built from nothing rather than one
            somebody prepared by hand.
            .
            It is a different assertion from check-omarchy-iso-vm, which proves the
            unattended INSTALL. This proves the DEPLOY on top of it: that charly can
            add a package repository, import its key, install a native package and
            enable its units in a guest whose pacman is pinned to Omarchy's own frozen
            mirror snapshot — none of which is possible without the passwordless sudo
            established at prepare-venue for source.kind: iso.
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            - check: charly is on PATH in the guest and runs
              id: charly-omarchy-cli-present
              context:
                - runtime
              stdout:
                - contains: OpenCharly
              command:
                # `--version` on this binary prints the usage banner, which names the
                # product — asserting that rather than a version string, because the
                # banner is what the command actually emits and a check must assert what
                # is true, not what would read better.
                command: charly --version 2>&1 | head -5

            - check: the charly package is installed
              id: charly-omarchy-package-installed
              context:
                - runtime
              package:
                  package: charly
                  installed: true

            - check: the charly on PATH is the PACKAGE's, not the staged host binary
              id: charly-omarchy-native-package
              context:
                - runtime
              # This one stays a `command:` step on purpose. The assertion is a
              # CORRELATION — that the binary PATH resolves to is the one pacman owns —
              # and `package:` alone cannot make it: the deploy path also stages a host
              # charly into /tmp for its own use (EnsureCharlyInGuest), so a guest can
              # have the package installed AND still resolve `charly` to the staged copy.
              # `pacman -Qo "$(command -v charly)"` is exactly that correlation.
              stdout:
                - contains: /usr/bin/charly
              command:
                command: pacman -Qo "$(command -v charly)"

            - check: the charly pacman repo was added and its key trusted
              id: charly-omarchy-repo-added
              context:
                - runtime
              # This is the assertion that needs allow_repo_changes AND root: a guest
              # whose pacman.conf is pinned to Omarchy's frozen mirror had a third-party
              # repo added to it. Asserting the Server line rather than exit-0 proves the
              # repo is not merely NAMED but resolvable.
              stdout:
                - matches: '\S'
              command:
                command: pacman-conf --repo charly Server

            - check: Omarchy's own frozen mirror survived the repo change
              id: charly-omarchy-mirror-intact
              context:
                - runtime
              stdout:
                - contains: omarchy.org
              command:
                # The regression this guards: adding a repo by rewriting pacman.conf
                # wholesale would silently drop the Server lines pinning core/extra to
                # Omarchy's snapshot, and the guest would start tracking upstream Arch
                # instead — a divergence pacman reports success for either way.
                command: pacman-conf --repo core Server

# ── omarchy-pacstrap-vm — the COMPOSABLE sibling ─────────────────────────────────
# omarchy-vm boots Omarchy's own installer ISO and lets Omarchy install itself.
# This one is charly's own machinery reproducing Omarchy from packages: pacstrap
# into a partitioned disk, limine onto the ESP, charly's fstab and unit
# enablement. Two different claims, and both are worth having.
#
# What it is FOR: fast rebuilds and derived images. The ISO path fetches 5.8 GiB
# and runs a full graphical installer; this path builds a rootfs from a package
# list you can edit, which is what you want when the thing under test is a
# package set rather than Omarchy's installer.
#
# What it is NOT: a claim that the result is byte-identical to an ISO install. It
# is not. The ISO install runs Omarchy's own orchestrator, which does work
# charly's bootstrap does not (snapper configuration, the UKI, the themed
# limine menu). check-omarchy-iso-vm remains the fidelity proof; this entity's
# bed proves only that the from-packages path produces a BOOTABLE Omarchy.
omarchy-pacstrap-vm:
    vm:
        # backend: libvirt is REQUIRED, not a default worth relying on. The bed's
        # probes RPC the daemon for THIS domain; `backend: auto` silently falls
        # back to qemu under load, creating the domain outside libvirt and failing
        # every libvirt-RPC probe with "Domain not found". The arch and
        # arch-pacstrap entities document the same failure mode.
        backend: libvirt
        source:
            kind: bootstrap
            builder: pacstrap
            builder_image: omarchy-pacstrap-builder
            distro: omarchy
            # The distro's own pacstrap.base_package supplies base/base-devel/linux/
            # linux-firmware/openssh/sudo/cloud-init/mkinitcpio/efibootmgr/limine/
            # btrfs-progs/omarchy-keyring. These are the additions this VM needs on
            # top, and nothing here is already in that list (a duplicate would be
            # harmless but would hide which list owns what).
            package:
                - qemu-guest-agent
                # WITHOUT THIS THE GUEST IS NOT OMARCHY. The distro's
                # pacstrap.base_package is the minimal bootstrap set (base, linux, openssh,
                # limine, btrfs-progs, omarchy-keyring …) and carries neither `omarchy` nor
                # `omarchy-settings`. Pacstrapping only that yields a plain Arch rootfs that
                # merely came from Omarchy's mirror — `ID=arch`, no /usr/share/omarchy, no
                # omarchy commands. The bed caught exactly that on its first run.
                #
                # `omarchy` is the metapackage; omarchy-settings arrives as its dependency
                # and is what replaces /etc/os-release, which is why ID=omarchy is the
                # observable consequence rather than a cosmetic label.
                - omarchy
            # btrfs, because Omarchy's layout IS btrfs subvolumes: the distro's
            # disk_layout declares @/@home/@log/@pkg and the ESP at /boot, and the
            # bootloader template's `rootflags=subvol=@` depends on it. ext4 here
            # would boot but would not be Omarchy.
            rootfs: btrfs
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 30G
        ram: 4G
        cpu: 2
        machine: q35
        # Omarchy requires Secure Boot OFF.
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: omarchy
            port_auto: true
            key_source: generate
        cloud_init:
            users:
                - name: omarchy
                  sudo: true
                  shell: /bin/bash
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent

check-omarchy-pacstrap-vm:
    vm:
        from: omarchy-pacstrap-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that charly's own from-packages path produces a BOOTABLE Omarchy —
            distinct from check-omarchy-iso-vm, which proves Omarchy's installer does.
            The privileged omarchy-pacstrap-builder pacstraps a rootfs from Omarchy's
            frozen mirror into a btrfs disk with the @/@home/@log/@pkg layout, installs
            limine onto an ESP at /boot, and the guest boots under UEFI.
            .
            What it can prove that the ISO bed cannot: that charly's OWN bootstrap
            machinery understands Omarchy — the distro's disk_layout, its limine
            bootloader template, and its package sources. If the ISO path regressed, this
            bed would still pass; if charly's bootstrap regressed, the ISO bed would still
            pass. They are independent claims about independent code.
        plan:
            - check: the domain is running under libvirt
              id: omarchy-pacstrap-libvirt-running
              libvirt: info
              stdout:
                - contains: running
              context:
                - runtime

            - check: the guest identifies as Omarchy, so the sources were Omarchy's
              id: omarchy-pacstrap-os-release
              context:
                - runtime
              stdout:
                - contains: 'ID=omarchy'
              command:
                # omarchy-settings replaces /etc/os-release, and it arrives only from
                # Omarchy's own repositories. A builder that had silently fetched from
                # upstream Arch would produce ID=arch here — which is precisely the
                # divergence omarchy-pacstrap-builder's `base: omarchy` exists to prevent,
                # and this is where it becomes observable in the finished guest.
                command: grep '^ID=' /etc/os-release

            - check: root is the @ subvolume of a btrfs filesystem
              id: omarchy-pacstrap-root-subvol
              context:
                - runtime
              stdout:
                - contains: 'subvol=/@'
              command:
                # The distro's disk_layout drove this, not the installer: charly's own
                # EmitDiskBuildScript created the subvolumes and mounted @ as root.
                command: findmnt -no FSTYPE,OPTIONS /

            - check: the ESP is vfat at /boot, the layout limine assumes
              id: omarchy-pacstrap-esp
              context:
                - runtime
              stdout:
                - contains: vfat
              command: {command: findmnt -no FSTYPE /boot}

            - check: the kernel was booted with the command line limine's config specifies
              id: omarchy-pacstrap-limine-cmdline
              context:
                - runtime
              stdout:
                - contains: 'rootflags=subvol=@'
                - contains: 'rootfstype=btrfs'
              command:
                # NOT efibootmgr, and the difference is the point.
                #
                # check-omarchy-iso-vm asserts a NAMED NVRAM entry (`Boot0005* Limine …
                # limine_x64.efi`) because Omarchy's installer registers one. The bootstrap
                # path does not: charly's install_template runs `efibootmgr --create` inside
                # the builder container against a loop device, where the write does not reach
                # the guest's own OVMF variable store. The guest boots limine anyway, through
                # the firmware's auto-created removable-media entry:
                #
                #   BootCurrent: 0002
                #   Boot0002* UEFI Misc Device  PciRoot(…){auto_created_boot_option}
                #
                # which loads /boot/EFI/BOOT/BOOTX64.EFI — limine's binary, put there by the
                # same template. Asserting a named entry here would demand a mechanism this
                # path legitimately does not use, and the bed's first run failed on exactly
                # that. This is a corrected check, not a weakened one.
                #
                # /proc/cmdline is the stronger assertion available: these flags exist ONLY in
                # the limine.conf charly's bootloader template wrote, so the running kernel
                # having them proves that config drove this boot. A guest that booted some
                # other way could not have them.
                command: cat /proc/cmdline

            - check: limine's loader is on the ESP where the firmware finds it
              id: omarchy-pacstrap-limine-on-esp
              context:
                - runtime
              stdout:
                - contains: LIMINE-ON-ESP
              command:
                # The removable-media fallback path the firmware actually used. Root is needed
                # because the ESP mounts 0700; the guest's cloud_init user has passwordless
                # sudo, unlike the ISO guest's.
                command: |
                    set -eu
                    sudo -n test -f /boot/EFI/BOOT/BOOTX64.EFI
                    sudo -n test -f /boot/limine.conf
                    echo LIMINE-ON-ESP


# ── check-omarchy-desktop-vm — the DESKTOP, not the install ──────────────────────
# check-omarchy-iso-vm proves Omarchy installs itself unattended and asserts 52 facts
# about the installed system. It deliberately does NOT log in: a stock Omarchy boots to
# the sddm greeter and waits for a human, and adding autologin to that bed would weaken
# the one thing it exists to prove — that a STOCK unattended install is correct.
#
# So the desktop gets its own bed. Measured on a guest installed by check-omarchy-iso-vm:
#
#     sddm: active          graphical.target: active
#     c1  962 sddm seat0 635 greeter tty1        <- stopped at the login screen
#     673 Hyprland --config /usr/share/sddm/hyprland.lua   <- sddm's GREETER compositor
#     /run/user/1000/hypr                        <- does not exist
#
# The only Hyprland running is sddm's own greeter. There is no user session, so every
# assertion upstream's session/panels/shell-surfaces suites make has nothing to observe.
# Omarchy's installer-written /etc/sddm.conf.d/99-omarchy-login.conf sets the theme and
# RememberLastUser and no autologin — correct for a desktop distro, fatal for a bed.
#
# This bed arranges the login explicitly, which is the same thing upstream's own ISO
# harness must do for its acceptance run. That is the ONLY difference from the stock
# guest; everything asserted below is Omarchy's own behaviour once somebody is logged in.
check-omarchy-desktop-vm:
    vm:
        from: omarchy-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that the Omarchy DESKTOP actually comes up — that a logged-in
            session reaches a live Hyprland with the Quickshell shell's layer surfaces
            mapped and on screen. Derives from the omarchy-vm template, so the guest is
            the same faithful unattended ISO install check-omarchy-iso-vm gates; the only
            addition is an sddm autologin drop-in, because a stock Omarchy waits at the
            greeter for a human and a bed has none.
            .
            What it proves that check-omarchy-iso-vm cannot: that install-time correctness
            (52 assertions there) actually produces a WORKING desktop. Those are different
            claims — a guest can have every package, unit and subvolume right and still
            fail to draw a bar.
            .
            The bar assertions are the reason `wl: hypr-layers` exists. A layer surface can
            be MAPPED but parked outside the monitor — that is how Omarchy hides its bar,
            because unmapping would force the surface to be rebuilt on reveal. Shown and
            hidden are the same `hyprctl -j layers` JSON except for coordinates, so
            presence alone cannot tell them apart; the method correlates each surface
            against the monitor's logical bounds and emits an onscreen/offscreen verdict.
        add_candy:
            # plugin-wl serves the `wl:` check verb OUT OF PROCESS, host-side. Nothing in
            # this VM's image closure requires it — the wl: steps below are authored INLINE
            # in the plan — so it rides in here and the host check runner loads it via the
            # deploy's add_candy. Same mechanism distro-arch uses for plugin-spice.
            #
            # This pin is not optional decoration. WITHOUT it the wl: steps do not fail:
            # they SKIP as an unknown verb, and a skipped step reads as not-failed in the
            # summary. Six of this bed's assertions would silently assert nothing and the
            # bed would report green.
            #
            # v2026.242.2204 is the first tag carrying `hypr-layers` (plugin-wl#7); the
            # bar hide/reveal assertions below do not exist before it.
            - '@github.com/opencharly/plugin-wl/candy/plugin-wl:v2026.242.2204'
            # omarchy-autologin writes the sddm drop-in and restarts sddm. It is a CANDY,
            # not a plan step, because a deploy's run: steps are install-timeline steps:
            # `charly check live` runs verify-only and skips every mutating step, and a
            # from:-derived VM on a cached image never replays them. Authored as plan run:
            # steps here they executed in NEITHER phase — the drop-in was never written and
            # all nine desktop assertions failed against a guest still at the greeter.
            - omarchy-autologin
        install_opts:
            allow_root_tasks: true
        plan:
            # ── the session exists at all ───────────────────────────────────────────
            - check: a user Hyprland session is running, not just sddm's greeter compositor
              id: omarchy-desktop-session-up
              context:
                  - runtime
              # The instance directory is the discriminator. sddm's greeter runs its OWN
              # Hyprland (--config /usr/share/sddm/hyprland.lua) as the sddm user, which
              # leaves nothing in /run/user/1000. This directory existing means the LOGGED-IN
              # user has a compositor, which is the precondition for everything below.
              eventually: 120s
              file:
                  file: /run/user/1000/hypr
                  filetype: directory

            - check: the compositor reports a monitor
              id: omarchy-desktop-monitor
              context:
                  - runtime
              eventually: 60s
              wl: hypr-monitors
              stdout:
                  - contains: '"name"'

            - check: the wl verb reports hyprland as the live compositor
              id: omarchy-desktop-compositor
              context:
                  - runtime
              eventually: 60s
              wl: status
              stdout:
                  - contains: hyprland

            # ── the Quickshell shell's surfaces ─────────────────────────────────────
            - check: the omarchy shell answers a ping
              id: omarchy-desktop-shell-ping
              context:
                  - runtime
              # `omarchy-shell shell ping` is the shell's own IPC. Running a program and
              # asserting it succeeds is what the `command:` verb is for; there is no
              # charly verb for a desktop shell's control channel yet.
              #
              # OMARCHY_PATH is set explicitly because omarchy-shell hard-fails with
              # "OMARCHY_PATH is not set" without it, and the guest only exports it through
              # the bash rc chain (/usr/share/omarchy/default/bash/env-bootstrap, which the
              # guest itself documents as the single source of truth). A charly command step
              # is not a login shell, so it inherits nothing. /usr/share/omarchy is the value
              # env-bootstrap falls back to on a production install — the dev-link override
              # in /etc/omarchy.conf does not exist on a stock guest.
              eventually: 120s
              command:
                  command: env OMARCHY_PATH=/usr/share/omarchy omarchy-shell shell ping

            - check: the background layer surface is mapped and on screen
              id: omarchy-desktop-background-onscreen
              context:
                  - runtime
              # hypr-clients cannot see this: the wallpaper is a layer-shell surface, not a
              # toplevel. Every method this plugin had before hypr-layers was blind to it.
              eventually: 120s
              wl: hypr-layers
              stdout:
                  - matches: 'omarchy-background\s.*\sonscreen'

            - check: the bar layer surface is mapped and on screen
              id: omarchy-desktop-bar-onscreen
              context:
                  - runtime
              eventually: 120s
              wl: hypr-layers
              stdout:
                  - matches: 'omarchy-bar\s.*\sonscreen'

            # ── the assertion hypr-layers was built for ─────────────────────────────
            # Upstream's session-test.sh calls this out explicitly: "Hiding parks the bar
            # off-screen without unmapping its layer surface, and revealing brings that same
            # surface back on-screen." Presence is unchanged across both states; only the
            # geometry moves. A check that asserted presence would pass either way.
            - check: hide the bar
              id: omarchy-desktop-bar-hide
              context:
                  - runtime
              # A `run:` step here would SKIP under check-live's verify-only mode, and the
              # three assertions below would then measure a bar that was never hidden. The
              # mutation has to travel as a check verb to survive the phase that re-verifies
              # a rebuilt guest. `wl: exec` runs it in the venue and asserts it succeeded.
              #
              # `on` HIDES: omarchy-toggle-bar runs `omarchy-toggle bar-off on`, which touches
              # ~/.local/state/omarchy/toggles/bar-off. The argument names the flag, not the bar.
              wl:
                  method: exec
                  command: omarchy-toggle-bar on

            - check: the hidden bar stays MAPPED — it is parked, not destroyed
              id: omarchy-desktop-bar-hidden-mapped
              context:
                  - runtime
              eventually: 30s
              wl: hypr-layers
              stdout:
                  - contains: omarchy-bar

            - check: the hidden bar is parked OFF screen
              id: omarchy-desktop-bar-hidden-offscreen
              context:
                  - runtime
              eventually: 30s
              wl: hypr-layers
              stdout:
                  - matches: 'omarchy-bar\s.*\soffscreen'

            - check: reveal the bar again
              id: omarchy-desktop-bar-reveal
              context:
                  - runtime
              wl:
                  method: exec
                  command: omarchy-toggle-bar off

            - check: the revealed bar returns on screen
              id: omarchy-desktop-bar-revealed
              context:
                  - runtime
              eventually: 30s
              wl: hypr-layers
              stdout:
                  - matches: 'omarchy-bar\s.*\sonscreen'

            # ── the desktop is drawing something real ───────────────────────────────
            - check: the desktop renders a non-uniform screenshot
              id: omarchy-desktop-screenshot
              context:
                  - runtime
              # artifact_not_uniform is what makes this more than "grim exited 0": a 100KB
              # all-black PNG passes a byte check and fails this one, which is exactly the
              # failure mode a compositor that started but never drew produces.
              eventually: 60s
              wl:
                  method: screenshot
                  artifact: /tmp/omarchy-desktop.png
                  artifact_min_bytes: 10000
                  artifact_not_uniform: true
