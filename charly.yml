#  opencharly/distro-omarchy — the Omarchy image family (charly's box/omarchy).
#
#  Omarchy (omacom/omarchy) is DHH's opinionated distribution: vanilla Arch + Hyprland,
#  with its own package repository AND its own pinned snapshot of the Arch repositories.
#
#  ARCH-DERIVED, via the TAG CHAIN. Every box carries `distro: [omarchy, arch]`, so an
#  omarchy: package section wins where one exists and all 99 existing `distro: arch:`
#  candy sections apply unchanged everywhere else. No candy needs an omarchy: section;
#  one is added only where a package NAME genuinely differs from Arch's. This is the
#  same mechanism distro-cachyos uses, and it is why this repo vendors almost nothing.
#
#  x86_64 ONLY. pkgs.omarchy.org publishes no aarch64 tree (verified: 404), so every box
#  pins platform: [linux/amd64] and there is no archarm sibling.
#
#  We do NOT run Omarchy's own installer. In 4.x there is no install.sh at the repo root
#  at all: `install/` is the machinery the ISO runs, and the ISO is the install path.
#  charly composes the same four packages the ISO installs (omarchy, omarchy-settings,
#  omarchy-keyring, omarchy-nvim) from the same repositories — see layer-omarchy-base.
#  All 148 base packages resolve with plain pacman (23 from [omarchy], 125 from
#  core/extra/multilib served by Omarchy's mirror snapshot), which is why the base box is
#  `build: [pac]` with NO aur builder.
version: 2026.240.1943
repo: github.com/opencharly/distro-omarchy
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
import:
    # The Arch base and builder stack lives in opencharly/distro-arch. One-directional:
    # arch imports nothing back.
    - arch: '@github.com/opencharly/distro-arch:v2026.241.1429'
discover:
    - path: box
      recursive: true

# ── disposable R10 beds ──────────────────────────────────────────────────────────
# `disposable: true` is the SOLE authorization for the unattended destroy + rebuild
# `charly check run` performs. Zero operator side-effect: rootless podman, no writes to
# ~/.local/bin, ~/.config/opencharly, /etc or any operator-side directory.
check-omarchy-pod:
    pod:
        image: omarchy
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that the Omarchy base image composes from plain Arch plus Omarchy's
            own package sources. Builds the omarchy box and asserts, on the built image,
            that pacman resolves core/extra/multilib from Omarchy's pinned mirror snapshot
            rather than upstream Arch, that the [omarchy] repository answers and its
            packaging key is locally signed, that omarchy and omarchy-settings install
            with plain pacman and no AUR builder, that the four limine alpm hooks a
            container cannot satisfy were never extracted onto the image, and that
            /etc/skel is seeded into the image user's home.

check-omarchy-cstream-pod:
    pod:
        image: omarchy-cstream
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that the Omarchy DESKTOP runs. Builds the omarchy-cstream box and,
            on the started deployment, asserts that the Quickshell shell reaches a
            supervised RUNNING state under a nested Hyprland and that charly's own wl:
            verb reports hyprland as the live compositor — not a process-list inference.
            It is the bed that would catch a regression in the one arrangement that works:
            Hyprland cannot nest under selkies (pixelflux advertises wl_compositor v5 and
            Hyprland binds v6), so the desktop depends on gst-wayland-display being the
            parent, and on the box deriving FROM the omarchy base image so every layer
            resolves against the same package snapshot.

# ── Omarchy as a VM ──────────────────────────────────────────────────────────────────
#
# omarchy-vm is the FAITHFUL one: it boots Omarchy's own official installer ISO, fully
# unattended. What you get is what Omarchy's authors ship — limine + a UKI, btrfs
# @/@home/@log/@pkg, snapper, sddm + uwsm. Charly supplies only the answers.
#
# A composable sibling (omarchy-pacstrap-vm, charly's own machinery reproducing Omarchy
# from packages) is NOT here yet: it needs an omarchy-pacstrap-builder box, which needs
# `limine` added to layer-pacstrap-builder first — the bootloader install runs INSIDE the
# builder container against the mounted target, so the binary must exist there. That is
# its own repo's PR, and an entity naming a builder box that does not exist would not
# validate.
#
# A `charly-omarchy` keeper deploy would be a DEPLOY of this template, not a second
# template: a deploy's `from:` carries deploy-scope fields only (add_candy, install_opts,
# disposable, env, plan) and the VM SPEC comes wholly from the named kind: vm entity, so
# credentials live here and are never restated.

omarchy-vm:
    vm:
        # THE canonical Omarchy VM: the official ISO, run unattended.
        #
        # The ISO is 5.8 GiB. It is fetched once into charly's content-addressed cache,
        # sha256-verified against the .sha256 sidecar the publisher serves (no checksum
        # value is authored here — pinning a literal would go stale on every point
        # release while the sidecar cannot), and shared by every VM built from this URL.
        #
        # user / user with NO disk encryption, and that combination is deliberate. An
        # encrypted install is NOT fully unattended — someone types the LUKS passphrase
        # at first boot — and its passphrase sits in PLAINTEXT in the seed's
        # disk_encryption block, which would make this file a secret. With encrypt:
        # false there is no such block and nothing on the seed that is not already
        # public. Treat anything reachable from a VM built on this template as public.
        source:
            kind: iso
            distro: omarchy
            url: https://iso.omarchy.org/omarchy-4.0.1.iso
            checksum: {type: sha256}
            installer:
                username: user
                # PLAINTEXT here, crypt()ed to a $6$ SHA-512 hash by the builder before
                # it reaches any template — the plaintext never lands on the seed. The
                # answers volume carries only the hash.
                password: user
                full_name: Charly
                email: charly@opencharly.invalid
                hostname: omarchy
                timezone: UTC
                keyboard: us
                locale: en_US.UTF-8
                disk: /dev/vda
                encrypt: false
                # ssh_authorized_key is deliberately ABSENT: it defaults to the public
                # half of ssh.key_source: generate below. That default is what makes the
                # guest reachable at all — a stock Omarchy install ships openssh with the
                # service DISABLED and the port CLOSED, and the installer treats the
                # presence of an authorized_keys file on the seed as the instruction to
                # enable sshd and open the firewall. Naming a key here would silence that
                # default without saying so.
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        # Omarchy requires Secure Boot OFF.
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: user, port_auto: true, key_source: generate}
        backend: libvirt
        # A DISPLAY IS REQUIRED, not decorative. Omarchy's installer runs in a graphical
        # session on the ISO's live environment; a domain with no video device boots the
        # medium, runs cloud-init against the seed, and then sits idle forever with the
        # disk untouched — measured. The spice head is also what lets `charly check spice
        # screenshot` watch an unattended install actually progress, which is the only
        # way to see where one stalls.
        libvirt:
            devices:
                channels: [{type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
                rng: [{model: virtio, backend: /dev/urandom}]
                memballoon: {model: virtio}
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"

check-omarchy-iso-vm:
    vm:
        from: omarchy-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that Omarchy installs itself UNATTENDED from its own official ISO.
            Derives from the omarchy-vm template rather than restating it, so the
            credentials and the seed under test are exactly the ones the shipped entity
            carries. `disposable: true` authorizes the destroy + rebuild, which is what
            makes the claim meaningful: a bed that only ever inspected an
            already-installed guest would pass on a disk somebody installed by hand.
            .
            What it proves that nothing else can: the installer ran with NOBODY AT THE
            KEYBOARD. Every assertion below is a fact about the INSTALLED system that
            cannot be true unless charly's rendered answers were found, parsed and acted
            on — the btrfs subvolume layout and the ESP at /boot come from the partition
            geometry in the distro's installer: block, the account and its sudo group
            from user_credentials.json, the hostname and timezone from
            user_configuration.json, the git identity from the two .txt files, and sshd
            being enabled AT ALL from authorized_keys (a stock Omarchy install ships
            openssh with the service disabled and the port closed).
            .
            EVERY check runs as the unprivileged `user` the installer created, because
            that is the only account the seed authorizes and charly's check runner has no
            other. That constraint is a feature: it forced each assertion onto evidence
            that is READABLE rather than privileged, and every one of those turned out to
            be STRONGER than the root-only form it replaced. `findmnt` at each mountpoint
            proves a subvolume exists AND is mounted where the answers said, which `btrfs
            subvolume list` cannot; `efibootmgr` proves limine's EFI binary is on the ESP,
            registered as a boot entry, AND that the machine booted from it, which `test
            -d /boot/EFI/limine` cannot.
        plan:
            - check: the guest is the INSTALLED system, not the live ISO
              id: omarchy-iso-vm-installed
              context:
                - runtime
              stdout:
                - contains: 'ID=omarchy'
              command:
                # omarchy-settings REPLACES /etc/os-release, so ID=omarchy is only true of
                # an installed guest — archiso's live environment reports ID=arch. The
                # cheapest fact separating the two, and the one that fails loudly if this
                # bed is ever pointed at a guest that never installed.
                command: grep '^ID=' /etc/os-release

            - check: root is a btrfs @ subvolume, not the live ISO's overlay
              id: omarchy-iso-vm-root-subvol
              context:
                - runtime
              stdout:
                - contains: 'subvol=/@'
              command:
                command: findmnt -no FSTYPE,OPTIONS /

            - check: all four subvolumes are mounted where the answers placed them
              id: omarchy-iso-vm-subvolumes
              context:
                - runtime
              stdout:
                - contains: SUBVOLUMES-OK
              command:
                # `findmnt <mountpoint>` rather than `btrfs subvolume list /`: the latter
                # needs CAP_SYS_ADMIN (it fails as `user` with "can't perform the search:
                # Operation not permitted"), and it proves strictly LESS — a subvolume can
                # exist while being mounted nowhere, or mounted somewhere else. Asserting
                # the mount asserts the layout the installer answers actually asked for.
                command: |
                    set -eu
                    check() {
                      findmnt -no OPTIONS "$1" 2>/dev/null | tr ',' '\n' | grep -qx "subvol=/$2" || {
                        echo "$1 is not the $2 subvolume" >&2; exit 1; }
                    }
                    check /                      @
                    check /home                  @home
                    check /var/log               @log
                    check /var/cache/pacman/pkg  @pkg
                    echo SUBVOLUMES-OK

            - check: the ESP is vfat at /boot, not /boot/efi
              id: omarchy-iso-vm-esp
              context:
                - runtime
              stdout:
                - contains: vfat
              command:
                command: findmnt -no FSTYPE /boot

            - check: limine is on the ESP, registered, and is what the machine booted
              id: omarchy-iso-vm-limine
              context:
                - runtime
              stdout:
                - contains: LIMINE-BOOTED
              command:
                # `test -f /boot/limine.conf` cannot be used: the installed ESP is mode
                # 0700 root-only, so as `user` that is a permission denial and NOT
                # evidence about limine. efibootmgr reads efivars, needs no privilege, and
                # proves three things at once: limine_x64.efi is ON the ESP, a boot entry
                # names it, and BootCurrent says THIS boot came from it. A directory test
                # proves none of the three.
                command: |
                    set -eu
                    cur=$(efibootmgr | sed -n 's/^BootCurrent: //p')
                    efibootmgr | grep -q "^Boot${cur}\** Limine.*limine_x64\.efi" || {
                      echo "the running system did not boot from limine (BootCurrent=${cur})" >&2
                      efibootmgr >&2; exit 1; }
                    echo LIMINE-BOOTED

            - check: limine's config carries the answers' ESP path and root device
              id: omarchy-iso-vm-limine-config
              context:
                - runtime
              stdout:
                - contains: 'ESP_PATH="/boot"'
                - contains: 'rootflags=subvol=@'
              command:
                # /etc/default/limine is world-readable and is where the installer records
                # the geometry it chose. Asserting BOTH the ESP path and the root cmdline
                # ties the bootloader's own view back to the partition layout above.
                command: cat /etc/default/limine

            - check: snapper is configured for root and limine-snapper-sync is enabled
              id: omarchy-iso-vm-snapper
              context:
                - runtime
              stdout:
                - contains: SNAPPER-OK
              command:
                command: |
                    set -eu
                    test -f /etc/snapper/configs/root
                    systemctl is-enabled limine-snapper-sync >/dev/null
                    echo SNAPPER-OK

            - check: the account from user_credentials.json exists and is in wheel
              id: omarchy-iso-vm-account
              context:
                - runtime
              stdout:
                - contains: ACCOUNT-OK
              command:
                command: |
                    set -eu
                    getent passwd user >/dev/null
                    id -nG user | tr ' ' '\n' | grep -qx wheel
                    echo ACCOUNT-OK

            - check: the hostname from user_configuration.json was applied
              id: omarchy-iso-vm-hostname
              context:
                - runtime
              stdout:
                - contains: omarchy
              command:
                command: hostnamectl --static

            - check: the timezone from user_configuration.json was applied
              id: omarchy-iso-vm-timezone
              context:
                - runtime
              stdout:
                - contains: UTC
              command:
                command: readlink -f /etc/localtime

            - check: the git identity from the seed's two .txt files was applied
              id: omarchy-iso-vm-git-identity
              context:
                - runtime
              stdout:
                - contains: Charly
                - contains: charly@opencharly.invalid
              command:
                # user_full_name.txt and user_email_address.txt are OPTIONAL seed files.
                # Asserting them proves charly's renderer emitted the optional half of the
                # answer set and the installer consumed it — not just the required half.
                command: git config --global --get-regexp '^user\.'

            - check: the omarchy runtime and the desktop stack the ISO ships are installed
              id: omarchy-iso-vm-runtime
              context:
                - runtime
              stdout:
                - contains: RUNTIME-OK
              command:
                command: |
                    set -eu
                    pacman -Q omarchy omarchy-settings hyprland quickshell sddm uwsm \
                              limine limine-mkinitcpio-hook limine-snapper-sync snapper >/dev/null 2>&1
                    test -d /usr/share/omarchy/shell
                    echo RUNTIME-OK

            - check: sshd is enabled AND running — which only authorized_keys turns on
              id: omarchy-iso-vm-sshd
              context:
                - runtime
              stdout:
                - contains: SSHD-OK
              command:
                # A stock Omarchy install ships openssh with the unit disabled and the
                # firewall port closed. That this check can run AT ALL — it arrives over
                # ssh, on the key charly generated — is the proof; asserting the unit
                # state makes the proof explicit rather than incidental.
                command: |
                    set -eu
                    test "$(systemctl is-enabled sshd)" = enabled
                    test "$(systemctl is-active sshd)" = active
                    echo SSHD-OK

# ── charly-omarchy — the ready-to-run KEEPER ─────────────────────────────────────
# A DEPLOY of omarchy-vm, not a third template. A deploy's `from:` carries
# deploy-scope fields only (add_candy, install_opts, disposable, env, plan); the VM
# SPEC — source, disk/ram/cpu, firmware, ssh, libvirt — comes wholly from the named
# kind: vm entity. So the ISO, the seed and the credentials are the ones omarchy-vm
# already ships, stated once.
#
# NOT disposable: this one is meant to be kept. Its disposable twin below is what
# proves it, so that `charly update` can rebuild the bed from scratch without ever
# touching an operator's working guest.
charly-omarchy:
    vm:
        from: omarchy-vm
        lifecycle: dev
        description: >-
            Ready-to-run Omarchy with the charly toolchain on top: the faithful upstream
            ISO install (limine + a UKI, btrfs @/@home/@log/@pkg, snapper, sddm + uwsm,
            Hyprland and the Quickshell omarchy shell — the real thing, not a charly
            reconstruction), plus an on-PATH charly. Logs in as user/user, unencrypted,
            so treat anything reachable from it as public.
        add_candy:
            # charly installs as a NATIVE pac package from the charly-arch repo. omarchy
            # inherits arch's packaging (distro: [omarchy, arch]), so the layer's `arch:`
            # section applies unchanged and nothing omarchy-specific is needed here.
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
        install_opts:
            # The layer adds the [charly] pacman repo and imports its signing key, which
            # is a repo change by definition.
            allow_repo_changes: true
            # Installing a package and enabling its units needs root. The guest's
            # passwordless sudo is established at prepare-venue for source.kind: iso —
            # a stock Omarchy install grants the account PASSWORD-required sudo, which no
            # archinstall answer or Omarchy orchestrator hook can change.
            allow_root_tasks: true
            with_service: true
            # The layer carries rpm:/deb:-only sections for other families; skip them
            # rather than failing on a section this distro cannot use.
            skip_incompatible: true

# ── the disposable twin ──────────────────────────────────────────────────────────
# It derives from the TEMPLATE, not from charly-omarchy: a bed's `from:` names a
# kind: vm entity, and charly-omarchy is itself a deploy. Same add_candy and same
# install_opts, so what it proves is what the keeper does.
check-charly-omarchy-vm:
    vm:
        from: omarchy-vm
        disposable: true
        description: >-
            Sole proof that charly's own toolchain installs onto a guest Omarchy
            installed from its own ISO. `disposable: true` authorizes the destroy +
            rebuild, so the claim is about a guest built from nothing rather than one
            somebody prepared by hand.
            .
            It is a different assertion from check-omarchy-iso-vm, which proves the
            unattended INSTALL. This proves the DEPLOY on top of it: that charly can
            add a package repository, import its key, install a native package and
            enable its units in a guest whose pacman is pinned to Omarchy's own frozen
            mirror snapshot — none of which is possible without the passwordless sudo
            established at prepare-venue for source.kind: iso.
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            - check: charly is on PATH in the guest and runs
              id: charly-omarchy-cli-present
              context:
                - runtime
              stdout:
                - contains: OpenCharly
              command:
                # `--version` on this binary prints the usage banner, which names the
                # product — asserting that rather than a version string, because the
                # banner is what the command actually emits and a check must assert what
                # is true, not what would read better.
                command: charly --version 2>&1 | head -5

            - check: charly was installed as a NATIVE pac package, not copied in
              id: charly-omarchy-native-package
              context:
                - runtime
              stdout:
                - contains: NATIVE-OK
              command:
                # The distinction matters: the deploy path also stages a host charly into
                # /tmp for its own use (EnsureCharlyInGuest), and a check that only looked
                # for a binary on PATH would pass on that alone. `pacman -Qo` proves the
                # on-PATH one came from the package the layer installed.
                command: |
                    set -eu
                    pacman -Qo "$(command -v charly)" >/dev/null
                    pacman -Q charly >/dev/null
                    echo NATIVE-OK

            - check: the charly pacman repo was added and its key trusted
              id: charly-omarchy-repo-added
              context:
                - runtime
              stdout:
                - contains: REPO-OK
              command:
                # This is the assertion that needs allow_repo_changes AND root: a guest
                # whose pacman.conf is pinned to Omarchy's frozen mirror had a third-party
                # repo added to it.
                command: |
                    set -eu
                    pacman-conf --repo charly >/dev/null
                    echo REPO-OK

            - check: Omarchy's own frozen mirror survived the repo change
              id: charly-omarchy-mirror-intact
              context:
                - runtime
              stdout:
                - contains: omarchy.org
              command:
                # The regression this guards: adding a repo by rewriting pacman.conf
                # wholesale would silently drop the Server lines pinning core/extra to
                # Omarchy's snapshot, and the guest would start tracking upstream Arch
                # instead — a divergence pacman reports success for either way.
                command: pacman-conf --repo core Server
