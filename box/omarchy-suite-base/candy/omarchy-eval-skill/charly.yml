omarchy-eval-skill:
    skill:
        name: omarchy-eval
        family: distros
        owner: omarchy-eval
        description: |-
            The omarchy PR evaluation procedure — the charly-driven pipeline for
            evaluating omacom/omarchy PRs on disposable beds, using charly checks
            (not the upstream shell scripts) to assert the live omarchy system.
            NEVER mock anything: every check uses the REAL tool and REAL system
            state; system behavior is tested on the live VM, never claimed from a
            container run. MUST be invoked when evaluating an omarchy PR, running
            the omarchy evaluation beds (check-omarchy-suite-pod,
            check-omarchy-pr-vm, check-omarchy-pr-vm-visual), or grading omarchy
            visual changes.
        content: |-
            # /omarchy-eval:omarchy-pr-check

            Evaluate an omacom/omarchy PR with charly checks on disposable beds.
            The checks assert the PR's behavior on the REAL system with REAL tools.

            ## The first rule: NEVER mock anything — ever

            A check that substitutes a fake tool for the real one proves nothing
            about the PR. Every check must exercise the REAL tool, the REAL system
            state, the REAL behavior. If a behavior cannot be tested with the real
            tools available in the current tier (e.g. real cardwire, real btrfs
            snapshots, a real flatpak session), it must be tested on the live VM
            tier (Tier-2) — or not claimed at all. A mocked check is not evidence;
            a report built on mocks is useless. This rule is first because it is
            the whole point: an evaluation that mocks is not an evaluation.

            ## What each tier proves (honest semantics)

            A claim in a report is only as strong as the tier that produced it.
            Never claim live-system behavior from a container run.

            - Tier-1 container (pod): proves the PR's files are applied to the
              installed tree, and the script-level logic with the container's REAL
              tools (e.g. real pacman, real commands, real file state). It does
              NOT prove live system behavior: real hardware switching, real
              filesystem/snapshot behavior, a real session environment, real
              network state, real keypresses, real service behavior. No mocked
              tools, ever.
            - Tier-2 live VM (omarchy-vm): proves the PR's behavior on a real
              omarchy system — real cardwire, real btrfs snapshots, real flatpak,
              real network, real desktop. This is the tier for system-behavior
              claims.
            - Tier-2 visual / L3 GPU: desktop evidence and hardware-bound classes
              (PARTIAL/NOT-EVALUABLE when the hardware is unavailable — never a
              faked bed).

            Routing rule: a PR whose core behavior is system-level (hardware
            switching, filesystem/snapshot behavior, session environment, network
            state, keybindings, service behavior) MUST be evaluated on a live VM
            (Tier-2), not just the container.

            The validation's purpose: does it actually work? Reports answer in a
            friendly, first-person voice — like another user who tried the PR —
            and are crystal clear about what works and what still needs to be
            fixed. There are NO binary PASS/FAIL judgments: the report says "this
            part works" (verified on a live system), "this part does not work"
            (verified on a live system), and "this part is not yet tested on a
            live system" (no claim).

            Every "works" claim MUST be verified on a live system. A part that
            was not tested on a live system is never claimed to work — it is
            stated as "not yet tested on a live system", clearly, so the PR author
            knows exactly what still needs to be fixed or verified. A pod-only
            eval is NOT a validation: the container tier cannot test live system
            behavior, so a container run of a system-behavior PR proves nothing
            about the PR and must never be presented as a validation. If the
            validation cannot test the thing on a live system, the validation
            itself fails — the result is NO VALIDATION, and no report is
            produced.

            ## The beds

            - `check-omarchy-suite-pod` — Tier-1 pod: the omarchy base + the
              migration-outcome checks (retired-installer sudoers artifact absent,
              no legacy power udev rules, fido2 opt-in absent). Build context.
            - `check-omarchy-suite-pod-pr9343` — Tier-1 PR injection: the PR's
              files applied at BUILD time via a per-PR candy (candy run steps
              emit as Containerfile RUN, as root); the declarative check asserts
              the PR's behavior (e.g. omarchy-migrate --pending exits 2 with the
              message when the migrations dir is absent).
            - `check-omarchy-pr-vm` — Tier-2 VM PR injection: the shipped
              omarchy-vm template + the PR candy via add_candy (deploy time).
            - `check-omarchy-pr-vm-visual` — Tier-2 visual evidence loop: the
              desktop + a wl: screenshot capture + an agent-check step grading
              the visual against the visual-verification.md rubric (ADE).
            - `check-omarchy-hybrid-gpu-vm` — L3 dual-GPU hybrid bed: the
              virtio iGPU video beside a passed-through NVIDIA dGPU in ONE bed.
              The host is pre-flipped (`charly vm gpu mode vfio`); the deploy
              declares `requires_exclusive: [nvidia-gpu]` and `charly vm create`
              auto-allocates the whole-IOMMU-group hostdev. The in-guest
              `bin/omarchy-hw-hybrid-gpu` detection must be TRUE and a full
              switch cycle (bind/unbind, PCI runtime PM, compositor restart)
              must complete.

            ## VFIO GPU passthrough (L3 hybrid lane)

            - Host readiness: `charly vm gpu status` (IOMMU on, card bound to
              vfio-pci) — host `nvidia-smi` FAILS BY DESIGN on a passthrough-ready
              host (the card is bound to vfio-pci so a guest can claim it).
            - The hostdev is AUTO-ALLOCATED: a deploy declaring
              `requires_exclusive: [nvidia-gpu]` + the embedded `resource:`
              vocabulary (`nvidia-gpu: {resource: {gpu: {vendor: "0x10de"}}}` in
              charly/charly.yml) makes `charly vm create` detect the matching
              GPU, write its whole-IOMMU-group `hostdevs:` block into the
              per-domain instance.yml, and inject it — or FAIL HARD if absent.
            - The entity needs `backend: libvirt` + `firmware: uefi-insecure`
              (PCI <hostdev> renders only on libvirt; UEFI is mandatory for a
              modern GPU 64-bit large BAR).
            - The in-guest driver: the `layer-nvidia` kernel layer (blacklists
              the in-tree driver, regenerates the initramfs, reboots the guest).
            - The arbiter flips the GPU mode automatically (vfio for
              requires_exclusive, nvidia for requires_shared); `charly vm gpu
              mode [vfio|nvidia]` is the manual override.

            ## The procedure

            0. Evaluate from the template: opencharly/eval-omarchy's
               eval/PR-EVAL-TEMPLATE.md — every report and posted comment is
               rendered from it and carries its EXTERNAL, NON-AUTHORITATIVE
               (by opencharly.ai) disclaimer verbatim. Pick the CHANNEL base the
               PR targets: dev = source-checkout lane (PR head in ~/omarchy);
               edge/rc/stable = package-level lane; rc = the release-validation
               flow (channel-set + update + migrations).
            1. Load the rubric: omarchy's agents/skills (acceptance-tests,
               visual-verification, migrations, shell-dev, install-scripts,
               command-metadata, icon-font, hyprland, capture) — vendored and
               pinned at a quattro hash so evaluation criteria are version-locked.
            2. Tier 0: classify the diff (the venue-ladder map) and assign a
               venue; extract the PR's "## Verification" claim; hardware-bound
               classes get PARTIAL/NOT-EVALUABLE, never a faked bed. Route
               system-behavior PRs (hardware switching, filesystem/snapshot
               behavior, session environment, network state, keybindings,
               services) to the live VM tier — the container tier alone is
               insufficient for them.
            3. Apply the PR at the channel's seam (the apply contract): fetch
               pull/<N>/head SHA-pinned, install ONLY the changed files over the
               installed tree (dev lane: check out the PR head in ~/omarchy),
               and prove application with a pr-applied check — the known-red
               fixture surfaces a missed apply per-check.
            4. Tier 1: `charly check run check-omarchy-suite-pod` (or the
               PR-variant bed) — the suite pod's charly checks, with REAL tools
               only (never mocks). Every PR-specific check must fail without the
               PR applied (the known-red fixture).
            5. Tier 2 (by class): `charly check run check-omarchy-pr-vm` /
               `check-omarchy-pr-vm-visual` — the VM PR injection + visual
               evidence loop.
            6. Snapshot lane (batches): one base VM per channel, clean-snapshotted
               (vm deploy `snapshot: on_finalize: golden`); per PR: libvirt
               snapshot/revert → re-apply the PR → `charly check live` →
               evidence → revert. Record base provenance (channel, ISO calver,
               snapshot id) in the report; verdicts can go STALE — compare the
               evaluated head with the PR's current head.
            7. Evidence contract: the check-run summary.yml + the screenshot
               artifact + the ADE verdict (charly check feature run --agent).
            8. Render the validation comment from eval/PR-EVAL-TEMPLATE.md;
               POST only behind the operator approval gate. Before finalizing or
               posting, a COLD READER who did not author the evaluation validates
               the report against the criteria (never mock, known-red, tier
               compliance, claims scoped to the tier, recordings non-empty,
               Assisted-by footer, disclaimer, triage) — a report that fails the
               cold read is fixed, not posted.
            9. Batch loop: repeated bed runs, one per PR, with the SHA-keyed
               result cache (eval-omarchy's scripts/omarchy-rollup.py) skipping
               unchanged heads.

            ## Update-channel machinery (channel-class PRs)

            - `omarchy-channel-set <ch>` round-trips (get/set; re-set the same
              channel is a no-op).
            - Updates run pending migrations per channel (the S5 harness is the
              per-channel variant); the stable mirror runs one month behind —
              assert tracking, not a version string.
            - The pacman guard: a bare `pacman -Syu` / `yay -Syu` is stopped and
              pointed at `omarchy update` (one-transaction bypass exists).
            - The dev channel binds the OS to a git checkout in ~/omarchy: apply
              PRs there by checking out the PR head and updating.

            ## Guardrails (from doctrine)

            - NEVER mock anything — a mocked check is not evidence; a report built
              on mocks is useless.
            - Every PR-specific check must fail without the PR applied (the
              known-red fixture); general sanity checks are labeled
              non-PR-specific and never counted as PR proof.
            - Claims are scoped to the tier that produced them: a container run
              proves script logic and file application with REAL tools, never live
              system behavior; system-behavior claims come from the Tier-2 live VM.
            - Never let an ADE/iteration loop rewrite widget QML wholesale
              (shell-dev.md glyph loss).
            - Migrations double-run (the S5 harness proves idempotence).
            - Assert the SERVES not the RUNS (quickshell: ping reads responses;
              a supervisor uptime can pass on a wait wrapper).
            - PR-body claims are claims, not facts.
