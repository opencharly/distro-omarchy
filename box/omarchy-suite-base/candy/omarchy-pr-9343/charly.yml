omarchy-pr-9343:
    candy:
        version: 2026.243.0000
        description: |
            Applies PR #9343 (omacom/omarchy) to the omarchy system at BUILD time:
            fetches the PR head and installs its changed files over the installed
            tree. The PR changes bin/omarchy-migrate to fail --pending with exit 2
            + "migrations directory missing" when the migrations dir is absent
            (upstream main exits 1 silently). A candy's run steps are the install
            timeline — they emit as Containerfile RUN directives (as root), so the
            PR's files land in the image once, and the checks that follow are
            idempotent state/behavior assertions with no side effects.
        plan:
            - run: fetch PR #9343's head and install its changed files
              id: pr-apply
              command: |
                  set -eu
                  rm -rf /tmp/pr-src
                  git init -q /tmp/pr-src
                  cd /tmp/pr-src
                  git remote add origin https://github.com/omacom/omarchy
                  git fetch -q --depth 1 origin pull/9343/head
                  git checkout -q FETCH_HEAD
                  cp bin/omarchy-migrate /usr/share/omarchy/bin/omarchy-migrate
            - check: the PR's omarchy-migrate is installed
              id: pr-applied
              context:
                - build
              file:
                  file: /usr/share/omarchy/bin/omarchy-migrate
                  exists: true
