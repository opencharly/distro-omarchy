omarchy-suite-base-red:
    candy:
        version: 2026.243.0000
        description: |
            The S2 known-red image: the suite-base image with UPSTREAM MAIN's
            omarchy-migrate installed (the omarchy-pr-red fixture) plus the same
            declarative behavior check. The check MUST FAIL — upstream main exits
            1 silently, not 2 with the message — proving the check surfaces a
            wrong change per-check (the charly equivalent of per-file failure
            surfacing). Expected to fail by design.
        base: omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-red
        plan:
            - check: migrate --pending fails closed when the migrations dir is missing
              id: pr9343-migrate-pending-missing-dir
              context:
                - build
              env:
                  OMARCHY_PATH: /tmp/missing-omarchy
              command:
                  command: /usr/share/omarchy/bin/omarchy-migrate --pending
              exit_status: 2
              stderr:
                  - contains: migrations directory missing
