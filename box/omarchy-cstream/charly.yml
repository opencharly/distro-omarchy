omarchy-cstream:
    candy:
        description: |
            The Omarchy desktop, streamed to a browser — Hyprland with its Quickshell shell.
            The GUI edition of the Omarchy image family: the base image plus the cstream
            transport spine, a nested Hyprland, and Omarchy's own shell, terminal, themes
            and fonts. What a user gets is the real Omarchy desktop — the Quickshell bar,
            notifier, launcher and OSD from /usr/share/omarchy/shell — reachable over
            HTTPS instead of over a monitor cable.

            ## Why cstream and NOT selkies

            charly has two pod-GUI stacks and they are not interchangeable. Selkies
            (pixelflux) hosts labwc and KDE. It CANNOT host Hyprland, and the reason is a
            protocol version, not a missing GPU:

                wl_registry#2: error 0: invalid version for global wl_compositor (2):
                expected at most 5, got 6
                terminate called after throwing an instance of 'std::runtime_error'
                  what():  CBackend::create() failed!

            Hyprland binds wl_compositor at v6; pixelflux advertises at most v5. No env
            knob, device mapping or render node fixes that. pod-hyprland's own description
            records the same constraint from the other side — the parent must advertise
            zwp_linux_dmabuf_v1 AND bind xdg_wm_base at version 6, and gst-wayland-display
            (Smithay) is what clears both. layer-cstream-desktop is that parent plus the
            compositor, composed as one name.

            ## Why it BASES on omarchy rather than composing omarchy-base

            omarchy-repo repoints pacman at Omarchy's frozen mirror snapshot, and that only
            governs candies ordered after it. A `require:` cannot be added to somebody
            else's layer, so composing omarchy-base as a peer candy let
            layer-gst-wayland-display and pod-cstream install gstreamer 1.28.6-3 from
            UPSTREAM Arch first; pod-cstream's own gst-plugins-good then resolved to the
            snapshot's 1.28.6-2 and the transaction died outright with
            `installing gstreamer (1.28.6-2) breaks dependency 'gstreamer=1.28.6-3'`.
            Deriving FROM the base image puts the repository configuration in the FROM
            layer, where every later package in every later candy inherits it.

            Verifiable on a running deployment: the omarchy-shell service reaches RUNNING
            under the nested compositor, and charly's own wl: verb reports hyprland.
        base: omarchy
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            # The parent that streams + the compositor that draws, as one name.
            - '@github.com/opencharly/layer-cstream-desktop:v2026.242.0422'
            # Omarchy's own desktop content.
            - '@github.com/opencharly/layer-omarchy-shell/candy/omarchy-shell:v2026.242.0835'
            - '@github.com/opencharly/layer-omarchy-hyprland/candy/omarchy-hyprland:v2026.242.0835'
            - '@github.com/opencharly/layer-omarchy-terminal/candy/omarchy-terminal:v2026.242.0616'
            - '@github.com/opencharly/layer-omarchy-themes/candy/omarchy-themes:v2026.242.0635'
            - '@github.com/opencharly/layer-omarchy-fonts/candy/omarchy-fonts:v2026.242.0557'
        plan:
            - check: the streamed desktop carries both halves — the Omarchy shell and the compositor it draws into
              id: omarchy-cstream-composed
              context:
                - build
              # A composition assertion, not a restatement: every member owns its own
              # checks. What this adds is that the two families actually coexist on ONE
              # image, which is the only claim a box can make that a candy cannot.
              exit_status: 0
              command: |
                  set -eu
                  test -d /usr/share/omarchy/shell || { echo "missing the Omarchy shell QML tree" >&2; exit 1; }
                  command -v quickshell >/dev/null || { echo "missing: quickshell" >&2; exit 1; }
                  command -v Hyprland >/dev/null || { echo "missing: Hyprland" >&2; exit 1; }
                  command -v foot >/dev/null || { echo "missing: foot" >&2; exit 1; }
